<!DOCTYPE html>
<html lang="vi">
<head>
<!-- Người phụ trách: E | TODO(E-1..E-32): giao diện mẫu chạy bằng dữ liệu mô phỏng, xem danh sách việc trong TODO.md. Việc lớn nhất là E-6: thay khối "Api mô phỏng" bằng fetch() tới server C++ -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ĐT08.vn – Mua sắm trực tuyến & Giao vận định vị tự động</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e3e6e6;
  --card:#ffffff;
  --tx:#0f1111;
  --mu:#565959;
  --bd:#d5d9d9;
  --nv1:#131921;
  --nv2:#232f3e;
  --ac:#e47911;
  --ac-h:#c45500;
  --ac2:#fef8f2;
  --amz-y:#ffd814;
  --amz-yh:#f7ca00;
  --amz-o:#ffa41c;
  --amz-oh:#fa8900;
  --amz-s:#febd69;
  --amz-bl:#007185;
  --ok:#007600;
  --er:#b12704;
  --sh:0 2px 5px rgba(15,17,17,.08);
  --sh-lg:0 6px 18px rgba(15,17,17,.15);
  --tA:#fff4e6;--tB:#e6f4f8;--tC:#eaf7ed;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}

/* ===== HEADER 2 TẦNG PHONG CÁCH AMAZON ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--nv1);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.top>div{max-width:1380px;margin:0 auto;padding:8px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{order:1;font-weight:900;font-size:21px;letter-spacing:-.5px;color:#fff;padding:6px 10px;border:1px solid transparent;border-radius:4px;display:flex;align-items:center;gap:6px;position:relative}
.logo:hover{border-color:#fff}
.logo span{color:var(--amz-s);font-weight:800}
.logo::after{content:"";position:absolute;left:36px;right:14px;bottom:3px;height:3px;background:var(--amz-s);border-radius:50%}

.loc-box{order:1;display:flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid transparent;border-radius:4px;font-size:12px;line-height:1.25;color:#ccc;cursor:pointer}
.loc-box:hover{border-color:#fff}
.loc-box b{color:#fff;font-size:13px;display:block}
@media(max-width:900px){.loc-box{display:none}}

.sbar{order:2;flex:1;min-width:220px;display:flex;background:#fff;border-radius:6px;overflow:hidden;border:2px solid transparent;transition:border-color .15s}
.sbar:focus-within{border-color:var(--amz-o);box-shadow:0 0 0 2px rgba(255,164,28,.35)}
.sbar-cat{background:#f3f3f3;color:#333;font-size:12px;font-weight:600;padding:0 10px;display:flex;align-items:center;border-right:1px solid #cdcdcd;white-space:nowrap;user-select:none}
.sbar input{flex:1;min-width:0;border:0;background:transparent;color:#0f1111;padding:9px 12px;font-size:14.5px;outline:0}
.sbar button{border:0;background:var(--amz-s);color:#111;padding:0 18px;cursor:pointer;font-size:17px;font-weight:700;transition:background .15s}
.sbar button:hover{background:#f3a847}

.me{order:3;display:flex;align-items:center;gap:8px;margin-left:auto}
.me .av{width:32px;height:32px;border-radius:50%;background:var(--amz-s);color:#111;display:grid;place-items:center;font-weight:800;font-size:14px}
.me .mn{line-height:1.25;font-size:12px;color:#fff}
.me .mn b{font-size:13.5px}
.me .btn{background:var(--amz-s);color:#111;padding:7px 13px;border-radius:6px;font-size:13px;font-weight:700}
.me .btn:hover{background:#f3a847}
.me .chip{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);padding:6px 12px;font-size:12.5px;border-radius:6px}
.me .chip:hover{border-color:#fff;background:rgba(255,255,255,.1)}
.me .btn.sm[data-a=logout]{background:#37475a;color:#fff;border:1px solid rgba(255,255,255,.2)}
.me .btn.sm[data-a=logout]:hover{background:#485769}

.hcart{order:4;position:relative;border:1px solid transparent;background:none;color:#fff;font-size:24px;cursor:pointer;padding:5px 10px;border-radius:4px;display:flex;align-items:flex-end;gap:4px}
.hcart:hover{border-color:#fff}
.hcart::after{content:"Giỏ hàng";font-size:13px;font-weight:700;line-height:1}
.hcart .cnt{position:absolute;top:1px;left:22px;background:var(--amz-o);color:#111;margin:0;font-size:12px;font-weight:900;padding:1px 6px;border-radius:99px}
@media(max-width:640px){.hcart::after{display:none}}

nav{order:5;flex-basis:100%;background:var(--nv2);margin:8px -16px 0;padding:5px 16px;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:3px;color:#fff;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:.12s}
nav button:hover{border-color:#fff}
nav button.on{background:#fff;color:var(--nv1);font-weight:700;border-color:#fff}
.cnt{background:var(--amz-o);color:#111;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px;font-weight:800}
nav .on .cnt{background:var(--nv1);color:#fff}
.cnt:empty{display:none}

/* ===== BỐ CỤC CHÍNH ===== */
main{max-width:1340px;margin:0 auto;padding:16px 16px 80px}
.pane{display:none}.pane.on{display:block;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--sh);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}

/* ===== KHUNG ẢNH SẢN PHẨM CHỐNG BỂ FORM ===== */
.ic,.pdi{position:relative;overflow:hidden;border-radius:6px;display:grid;place-items:center;background:#f7f8f8;user-select:none;flex-shrink:0}
.ic{height:92px;font-size:44px;margin-bottom:8px}
.pc .ic{height:210px;aspect-ratio:1/1;width:100%;font-size:56px;margin-bottom:10px;border-radius:6px;background:#f8f9fa}
.pdi{width:100%;height:380px;border-radius:8px;font-size:110px;border:1px solid var(--bd);background:#fff}
.ic img.pimg,.pdi img.pimg{width:100%;height:100%;object-fit:cover;object-position:center;display:block;transition:transform .3s ease}
.pc:hover .ic img.pimg{transform:scale(1.04)}
.ic .fb-em,.pdi .fb-em{display:grid;place-items:center;width:100%;height:100%}
.tTT{background:var(--tA)}.tDT{background:var(--tB)}.tNS{background:var(--tC)}
.sold-out{position:absolute;inset:0;background:rgba(15,17,17,.65);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;letter-spacing:.5px;text-transform:uppercase;z-index:3}

.amz-choice{position:absolute;top:0;left:0;background:#232f3e;color:#fff;font-size:11px;font-weight:700;padding:3px 10px 3px 8px;clip-path:polygon(0 0,100% 0,90% 100%,0% 100%);z-index:2}
.amz-choice span{color:var(--amz-s)}
.amz-best{position:absolute;top:0;left:0;background:#c45500;color:#fff;font-size:11px;font-weight:700;padding:3px 10px 3px 8px;clip-path:polygon(0 0,100% 0,90% 100%,0% 100%);z-index:2}
.shop-tag{position:absolute;bottom:6px;right:6px;background:rgba(255,255,255,.94);color:#0f1111;border:1px solid var(--bd);font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;z-index:2}

.pc{display:flex;flex-direction:column;gap:4px;cursor:pointer;padding:14px;border-radius:8px;transition:box-shadow .18s,border-color .18s}
.pc:hover{box-shadow:var(--sh-lg);border-color:#a8b0b0}
.nm{font-weight:700}
.nm2{font-weight:600;font-size:15px;color:#0f1111;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em;line-height:1.35}
.pc:hover .nm2{color:var(--ac-h)}
.stars{color:#ffa41c;font-size:13.5px;letter-spacing:.5px}
.mu{color:var(--mu);font-size:12.5px}
.pr{font-weight:700;color:#0f1111;font-size:21px;letter-spacing:-.3px}
.prime-line{font-size:12px;color:#007185;font-weight:600;display:flex;align-items:center;gap:4px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}

/* Nút bấm chuẩn Amazon */
.btn{border:1px solid #e6a400;background:var(--amz-o);color:#0f1111;padding:9px 16px;border-radius:99px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:0 2px 5px rgba(213,217,217,.5);transition:background .15s}
.btn:hover:not(:disabled){background:var(--amz-oh)}
.btn.amz-add,.pc .btn.sm{background:var(--amz-y);border-color:#fcd200;color:#0f1111;border-radius:99px;font-weight:600}
.btn.amz-add:hover:not(:disabled),.pc .btn.sm:hover:not(:disabled){background:var(--amz-yh)}
.btn.ghost{background:var(--amz-y);color:#0f1111;border:1px solid #fcd200}
.btn.ghost:hover:not(:disabled){background:var(--amz-yh)}
.btn.sm{padding:6px 14px;font-size:12.5px}.btn:disabled{opacity:.45;cursor:not-allowed}

/* ===== GOOGLE MAPS & KHUNG ĐO KHOẢNG CÁCH TỰ ĐỘNG ===== */
.map-wrap{position:relative;width:100%;height:260px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);background:#e5e3df;margin-top:10px}
.map-wrap iframe{width:100%;height:100%;border:0;display:block}
.route-box{background:#f7fafa;border:1px solid #b8e2e8;border-radius:8px;padding:12px;margin-top:10px}
.route-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:13px;gap:8px}
.route-row:last-child{border-bottom:0;padding-bottom:0}
.km-pill{background:var(--nv2);color:var(--amz-s);padding:4px 12px;border-radius:99px;font-weight:800;font-size:13px;white-space:nowrap}
.fee-break{background:#fff8ed;border:1px solid #f7ca00;border-radius:6px;padding:6px 8px;margin-top:6px;font-size:11.5px;color:#0f1111;line-height:1.45}

.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select{font:inherit;color:var(--tx);background:#fff;border:1px solid #888c8c;border-radius:6px;padding:8px 11px}
input:focus,select:focus{outline:0;border-color:#007185;box-shadow:0 0 0 3px #c8f3fa}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:#fff;color:var(--tx);padding:6px 13px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;font-weight:500}
.chip:hover{border-color:#007185;background:#f7fafa}
.chip.on{background:#edfdff;border-color:#007185;color:#007185;font-weight:700}

.two{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.two.wide{grid-template-columns:1fr 390px}.two.chat{grid-template-columns:320px 1fr}.two>*{min-width:0}
@media(max-width:860px){.two,.two.wide,.two.chat{grid-template-columns:1fr}}
.tw th,.tw td{white-space:nowrap}
.tw td:last-child{white-space:normal}
.addr{background:#f7fafa;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px;line-height:1.55}
.note{background:var(--ac2);border-left:4px solid var(--ac);border-radius:6px;padding:10px 12px;margin:10px 0;font-size:13px}
.sent{background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:9px 12px;margin:8px 0;font-size:13px;color:#14532d}
.cv{padding:11px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}.cv:hover,.cv.on{background:#edfdff;border-color:#007185}.cv .pv{color:var(--mu);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cth{height:350px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 4px;margin:10px 0}
.mg{max-width:82%;padding:9px 13px;border-radius:12px;background:#f0f2f2;font-size:14px;align-self:flex-start}.mg small{display:block;white-space:nowrap;color:var(--mu);font-size:11px;margin-bottom:2px}.mg.me{align-self:flex-end;background:#007185;color:#fff}.mg.me small{color:#d5f5fa}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--bd)}.ph small{display:block;color:var(--mu);font-size:11px;margin-top:3px}
.mb{margin-bottom:16px}
.cr{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.cr .ic{width:64px;height:64px;font-size:26px;margin:0;flex:none;border-radius:6px;border:1px solid #eee}.cr .nm{flex:1;min-width:0}
.st{display:inline-flex;align-items:center;gap:8px;background:#f0f2f2;border:1px solid var(--bd);border-radius:8px;padding:2px 6px}
.st button{width:26px;height:26px;border-radius:6px;border:0;background:transparent;color:var(--tx);cursor:pointer;font-weight:700;font-size:15px}
.st button:hover{background:#e3e6e6}
.x{border:0;background:none;color:#007185;cursor:pointer;font-size:13px;padding:4px}.x:hover{color:var(--er);text-decoration:underline}
.cp{padding:8px 12px;border:1px dashed #007185;background:#f7fafa;border-radius:6px;margin-top:6px;cursor:pointer;font-size:13px}.cp:hover{background:#edfdff}
.sr{display:flex;justify-content:space-between;padding:5px 0}
.sr.b{border-top:1px solid var(--bd);margin-top:8px;padding-top:10px;font-weight:800;font-size:18px;color:var(--er)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-top:10px}
.opt{border:2px solid var(--bd);border-radius:8px;padding:12px;cursor:pointer;background:#fff}.opt:hover{border-color:#007185}.opt.on{border-color:var(--ac);background:var(--ac2)}
.bd{display:inline-block;padding:3px 9px;border-radius:4px;font-size:12px;font-weight:700}
.b0{background:#e3e6e6;color:var(--mu)}.b1{background:#dbeafe;color:#1e40af}.b2{background:#fef3c7;color:#92400e}.b3{background:#dcfce7;color:var(--ok)}.b4{background:#fee2e2;color:var(--er)}.b5{background:#f3e8ff;color:#6b21a8}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}th{color:var(--mu);font-weight:700;font-size:12.5px;text-transform:uppercase;background:#f7fafa}
tr.s{cursor:pointer}tr.s:hover,tr.s.on{background:#f0f8ff}
.tl{list-style:none;margin:14px 0;padding:0 0 0 16px;border-left:2px solid var(--bd)}
.tl li{position:relative;padding:0 0 14px 14px;color:var(--mu)}
.tl li:before{content:"";position:absolute;left:-24px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bd);border:2px solid var(--card)}
.tl li.d{color:var(--tx)}.tl li.d:before{background:var(--ok)}
.pg{height:10px;border-radius:99px;background:#e3e6e6;overflow:hidden;margin-top:10px}.pg i{display:block;height:100%;background:var(--ac);border-radius:99px}
.big{font-size:36px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.s3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
.empty{text-align:center;padding:52px 12px;color:var(--mu)}.empty b{display:block;font-size:18px;color:var(--tx);margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--nv1);color:#fff;border-left:5px solid var(--amz-s);padding:11px 20px;border-radius:6px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;z-index:50;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.er{background:var(--er);border-left-color:#fff}
[hidden]{display:none!important}

#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#fff}
.lg{display:grid;grid-template-columns:1fr 1fr;max-width:860px;width:100%;border-radius:8px;overflow:hidden;box-shadow:var(--sh-lg);border:1px solid var(--bd);background:#fff}
.lb{background:linear-gradient(160deg,#131921,#232f3e 70%);color:#fff;padding:38px;display:flex;flex-direction:column;gap:14px}
.lb h2{margin:6px 0 0;font-size:24px;line-height:1.3;color:var(--amz-s)}.lb p{margin:0;opacity:.9}.lf{margin-top:auto;line-height:2.1;font-size:13.5px;color:#ddd}
.lr{padding:36px;display:flex;flex-direction:column;gap:12px}.lr h3{margin:0 0 4px;font-size:24px;font-weight:600}
@media(max-width:720px){.lg{grid-template-columns:1fr}.lb{padding:24px}.lf{display:none}.mn{display:none}}

.lk{border:0;background:none;color:var(--amz-bl);cursor:pointer;font:inherit;font-weight:600}.lk:hover{color:var(--ac-h);text-decoration:underline}
.h{margin:0 0 14px;font-size:22px;font-weight:700}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0}.fg label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--tx)}
.sm2{border:1px solid var(--bd);background:#f0f2f2;color:var(--tx);padding:5px 11px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px;font-weight:600;box-shadow:0 1px 2px rgba(15,17,17,.1)}.sm2:hover{background:#e3e6e6}

#fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#fb{border:2px solid var(--nv1);background:var(--amz-y);color:#0f1111;border-radius:99px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px}
#fb .cnt{background:var(--nv1);color:var(--amz-s);margin:0}
#fb.bump{animation:bump .45s}@keyframes bump{50%{transform:scale(1.15)}}
#fp{width:min(360px,calc(100vw - 32px));max-height:62vh;overflow:auto}

#bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#bnav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:600;padding:8px 0;cursor:pointer;position:relative}#bnav button span{display:block;font-size:20px}#bnav button.on{color:var(--ac-h);font-weight:800}#bnav .cnt{position:absolute;top:2px;left:calc(50% + 6px);margin:0}

.bn{height:180px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 42px;position:relative;margin-bottom:16px;overflow:hidden;box-shadow:var(--sh)}.bn h2{margin:0 0 6px;font-size:28px;font-weight:800}.bn p{margin:0;opacity:.95;font-size:15px}.bn .e{font-size:86px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25))}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#fff6;cursor:pointer}.dots i.on{background:var(--amz-s);width:24px;border-radius:99px}

.vch{display:flex;gap:12px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}.vc{flex:none;min-width:270px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:6px;padding:12px 15px;box-shadow:var(--sh)}
.cats{display:flex;gap:10px;overflow-x:auto;margin-bottom:16px;padding:12px 16px}.cat{flex:none;width:115px;border:1px solid var(--bd);background:#f7fafa;color:var(--tx);cursor:pointer;font:inherit;font-size:13px;font-weight:600;padding:10px 6px;border-radius:8px;transition:.15s}.cat:hover{border-color:#007185;background:#edfdff}.cat span{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 6px;border-radius:50%;background:#fff;border:1px solid var(--bd);font-size:24px}.cat.on{background:#edfdff;border:2px solid #007185;font-weight:800;color:#007185}
.stabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin-bottom:16px;box-shadow:var(--sh)}.stabs button{border:1px solid var(--bd);background:#f0f2f2;color:var(--tx);padding:7px 15px;border-radius:6px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}.stabs button.on{background:var(--nv2);color:#fff;border-color:var(--nv2)}.stabs select{padding:7px 12px}

/* Công thức Haversine tính khoảng cách đường bộ thực tế (km) giữa 2 tọa độ GPS */
function haversineKm(lat1,lon1,lat2,lon2){
 const R=6371,toRad=d=>d*Math.PI/180,
  dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1),
  a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2,
  duongChimBay=R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
 /* Nhân hệ số đường bộ thực tế 1.28, làm tròn 0.1 km */
 return Math.max(0.5,Math.round(duongChimBay*1.28*10)/10);
}

/* Phân giải tọa độ GPS tự động từ địa chỉ khách nhập */
let geoCache={},geoTimer=null;
function resolveAddressGps(diaChi){
 const raw=(diaChi||'').trim();
 if(!raw)return{lat:10.7843,lng:106.6844,matched:'Trung tâm TP.HCM'};
 if(geoCache[raw])return geoCache[raw];
 const norm=normVN(raw);
 const numMatch=norm.match(/^(\d+)/);
 const houseNum=numMatch?parseInt(numMatch[1],10):50;
 const streetOffset=Math.min(3.5,(houseNum%500)*0.000045);

 for(const item of AREA_GPS){
  if(item.k.some(kw=>norm.includes(kw))){
   return{lat:item.lat+streetOffset,lng:item.lng+streetOffset,matched:item.label};
  }
 }
 /* Nếu địa chỉ đường/phường bất kỳ chưa có trong danh mục tĩnh và đang chờ Nominatim:
    nội suy tọa độ ổn định từ nội dung địa chỉ */
 let hash=0;
 for(let i=0;i<norm.length;i++)hash=(hash*131+norm.charCodeAt(i))%100000;
 const angle=(hash%360)*Math.PI/180;
 const radiusKm=2.5+(hash%220)/10;
 const dLat=(radiusKm/111)*Math.cos(angle);
 const dLng=(radiusKm/111)*Math.sin(angle);
 return{lat:10.7731+dLat,lng:106.6970+dLng,matched:raw};
}

/* Tự động tính quãng đường từ từng Shop cố định trong giỏ hàng tới địa chỉ khách */
function calcOrderRoute(it,diaChi){
 const shops=[...new Set((it||[]).map(x=>x.sh))];
 const cust=resolveAddressGps(diaChi||'25 Lê Văn Sỹ, Quận 3, TP.HCM');
 if(!shops.length)return{km:1,cust,perShop:[]};

 const perShop=shops.map(sh=>{
  const s=SHOP_GPS[sh]||SHOP_GPS.TT;
  const dist=haversineKm(s.lat,s.lng,cust.lat,cust.lng);
  return{sh,ten:SHOPS[sh],shopAddr:SDC[sh],km:dist};
 });

 /* Cộng tổng quãng đường từ các Shop có hàng trong đơn tới địa chỉ khách */
 const totalKm=Math.max(0.5,Math.round(perShop.reduce((sum,x)=>sum+x.km,0)*10)/10);
 return{km:totalKm,cust,perShop};
}

/* Tự động gọi OpenStreetMap Nominatim Geocoding ngầm khi khách nhập địa chỉ để lấy tọa độ GPS chính xác của con đường */
function geocodeOnline(diaChi,cb){
 const raw=(diaChi||'').trim();
 if(raw.length<6)return;
 if(geoCache[raw]){if(cb)cb(geoCache[raw]);return}
 fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=vn&q='+encodeURIComponent(raw))
  .then(r=>r.json())
  .then(arr=>{
   if(arr&&arr[0]&&arr[0].lat&&arr[0].lon){
    geoCache[raw]={lat:+arr[0].lat,lng:+arr[0].lon,matched:arr[0].display_name};
    if(cb)cb(geoCache[raw]);
   }
  }).catch(()=>{});
}

function isImgUrl(v){
 if(!v)return false;
 const s=String(v).trim();
 return /^(https?:\/\/|data:image\/|\.?\/?img\/|\/)/i.test(s)||/\.(png|jpe?g|webp|gif|svg|avif)(\?.*)?$/i.test(s);
}
function renderThumb(p,extraHtml=''){
 const fb=FB_EMOJI[p.id]||ICN[p.sh]||'📦';
 if(isImgUrl(p.ic)){
  const safeSrc=String(p.ic).replace(/"/g,'&quot;'),safeAlt=String(p.ten||'').replace(/"/g,'&quot;');
  return `<img class="pimg" src="${safeSrc}" alt="${safeAlt}" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="fb-em" hidden>${fb}</span>${extraHtml}`;
 }
 return `<span class="fb-em">${p.ic||fb}</span>${extraHtml}`;
}

 if(ma){if(!COUPON[ma]||S.kmOff[ma])throw new Loi(E,'Mã không tồn tại hoặc đã tắt');
